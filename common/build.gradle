import groovy.json.JsonOutput
import org.gradle.api.artifacts.ProjectDependency

plugins { id 'java-library' }

def commonRoot = buildFile.canonicalFile.parentFile
def templeRoot = commonRoot.parentFile
def identity = new Properties()
new File(templeRoot, 'gradle.properties').withReader('UTF-8') { identity.load(it) }
def loader = rootProject.property('loader').toString()
def minecraft = rootProject.property('minecraft_version').toString()
def javaVersion = rootProject.property('java_version') as int
def targetId = "${loader}-${minecraft}"
def activeFile = new File(templeRoot, '.temple/active-target')
def active = (activeFile.isFile() ? activeFile.getText('UTF-8').trim() : identity.getProperty('temple_default_target')) == targetId
group = identity.getProperty('mod_group_id')
version = identity.getProperty('mod_version')
base.archivesName = "${identity.getProperty('mod_id')}-common-${targetId}"
layout.buildDirectory.set(new File(commonRoot, "build/${targetId}"))
java {
    toolchain.languageVersion = JavaLanguageVersion.of(javaVersion)
    withSourcesJar()
}
repositories { mavenCentral() }

def usesBlaze3dGpu = minecraft in ['26.2', '26.3']
def usesRenderPearl = minecraft == '26.3'
def usesIdentifier = minecraft in ['26.2', '26.3', '26.1.2']
def hasKilaGraph = loader == 'neoforge' && usesBlaze3dGpu
if (usesRenderPearl) {
    apply from: new File(templeRoot, 'gradle/target-conventions/renderpearl-263.gradle')
}

def layers = [
        new File(commonRoot, 'src/main'),
        new File(commonRoot, "src/compat/minecraft/graphics/${usesBlaze3dGpu ? 'blaze3d_gpu' : 'opengl_direct'}"),
        new File(commonRoot, "src/compat/minecraft/id/${usesIdentifier ? 'identifier' : 'resource_location'}")
]
if (usesBlaze3dGpu) {
    layers.add(new File(commonRoot, 'src/compat/minecraft/26.2'))
}
if (minecraft != '26.2') {
    layers.add(new File(commonRoot, "src/compat/minecraft/${minecraft}"))
}
layers.add(new File(commonRoot, "src/compat/${loader}"))
layers.add(new File(commonRoot, "src/compat/${loader}/${usesBlaze3dGpu ? 'blaze3d_gpu' : 'opengl_direct'}"))
if (hasKilaGraph) {
    layers.add(new File(commonRoot, 'src/compat/kilagraph/enabled'))
}
layers.add(new File(commonRoot, "src/compat/${loader}/${minecraft}"))
layers = layers.findAll { it.isDirectory() }

def javaDirectories = layers.collect { new File(it, 'java') }.findAll { it.isDirectory() }
def resourceDirectories = layers.reverse().collect { new File(it, 'resources') }.findAll { it.isDirectory() }
// Allow higher-priority version layers (e.g. 26.3) to cleanly override individual Java files from 26.2
def javaSourceTrees = []
Set<String> claimedJavaPaths = new HashSet<>()
javaDirectories.reverse().each { File dir ->
    Set<String> excludedForDir = new HashSet<>(claimedJavaPaths)
    if (dir.isDirectory()) {
        dir.eachFileRecurse { File f ->
            if (f.isFile() && f.name.endsWith('.java')) {
                claimedJavaPaths.add(dir.toPath().relativize(f.toPath()).toString().replace('\\', '/'))
            }
        }
    }
    javaSourceTrees.add(fileTree(dir) {
        include '**/*.java'
        if (!excludedForDir.isEmpty()) {
            exclude excludedForDir
        }
    })
}
javaSourceTrees = javaSourceTrees.reverse()
def packageName = identity.getProperty('mod_java_package', identity.getProperty('mod_group_id'))
def constants = new File(layout.buildDirectory.get().asFile, 'generated/sources/temple')
def constantFile = new File(constants, "${packageName.replace('.', '/')}/BuildInfo.java")
def constantText = "package ${packageName};\n\npublic final class BuildInfo {\n" +
        "    public static final String MOD_ID = ${JsonOutput.toJson(identity.getProperty('mod_id'))};\n" +
        "    private BuildInfo() {}\n}\n"
def generateBuildInfo = tasks.register('generateBuildInfo') {
    inputs.property('source', constantText)
    outputs.file(constantFile)
    doLast {
        constantFile.parentFile.mkdirs()
        constantFile.setText(constantText, 'UTF-8')
    }
}

def lombok = 'org.projectlombok:lombok:1.18.46'
dependencies {
    compileOnly lombok
    annotationProcessor lombok
    compileOnly 'com.google.code.findbugs:jsr305:3.0.2'
    compileOnly 'org.jspecify:jspecify:1.0.0'
    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.2'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher:1.10.2'
}

def renderPearlOutDir = new File(layout.buildDirectory.get().asFile, 'generated/sources/renderpearl')
def renderPearlTestOutDir = new File(layout.buildDirectory.get().asFile, 'generated/testSources/renderpearl')
def native263Dirs = javaDirectories.findAll {
    def p = it.canonicalPath.replace('\\', '/')
    p.endsWith('/26.3/java')
}
def sharedForRenderPearlDirs = javaDirectories.findAll { !native263Dirs.contains(it) }
def renderPearlScript = new File(templeRoot, 'gradle/target-conventions/renderpearl-263.gradle')
def prepareRenderPearlSources = tasks.register('prepareRenderPearlSources') {
    enabled = usesRenderPearl
    inputs.file(renderPearlScript)
    inputs.files(sharedForRenderPearlDirs.collect { fileTree(it) { include '**/*.java' } })
    inputs.files(native263Dirs.collect { fileTree(it) { include '**/*.java' } })
    outputs.dir(renderPearlOutDir)
    doLast {
        Set<String> nativePaths = new HashSet<>()
        native263Dirs.each { File d ->
            if (d.isDirectory()) {
                d.eachFileRecurse { File f ->
                    if (f.isFile() && f.name.endsWith('.java')) {
                        nativePaths.add(d.toPath().relativize(f.toPath()).toString().replace('\\', '/'))
                    }
                }
            }
        }
        lumenfxRemapRenderPearlSources(sharedForRenderPearlDirs, nativePaths, renderPearlOutDir)
    }
}
def prepareRenderPearlTestSources = tasks.register('prepareRenderPearlTestSources') {
    enabled = usesRenderPearl
    def testJavaDir = new File(commonRoot, 'src/test/java')
    inputs.file(renderPearlScript)
    inputs.dir(testJavaDir)
    outputs.dir(renderPearlTestOutDir)
    doLast {
        lumenfxRemapRenderPearlSources([testJavaDir], Collections.emptySet(), renderPearlTestOutDir)
    }
}

sourceSets {
    main {
        java.setSrcDirs(active ? javaDirectories + [constants] : [])
        resources.setSrcDirs(active ? resourceDirectories : [])
    }
    test {
        java.setSrcDirs(active ? [new File(commonRoot, usesBlaze3dGpu ? 'src/test/java' : 'src/test/opengl/java')] : [])
        resources.setSrcDirs(active ? [new File(commonRoot, usesBlaze3dGpu ? 'src/test/resources' : 'src/test/opengl/resources')] : [])
    }
}
tasks.named('compileJava', JavaCompile) {
    dependsOn generateBuildInfo
    if (usesRenderPearl) {
        dependsOn prepareRenderPearlSources
        source = files(renderPearlOutDir, native263Dirs, constants)
    } else {
        source = files(javaSourceTrees, constants)
    }
}
tasks.named('compileTestJava', JavaCompile) {
    def testJavaDir = new File(commonRoot, usesBlaze3dGpu ? 'src/test/java' : 'src/test/opengl/java')
    if (usesRenderPearl) {
        dependsOn prepareRenderPearlTestSources
        source = files(renderPearlTestOutDir)
    } else if (testJavaDir.isDirectory()) {
        source testJavaDir
    } else {
        source = files()
    }
}
tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = javaVersion
    options.debugOptions.debugLevel = 'source,lines'
}
tasks.named('processResources', ProcessResources) {
    from resourceDirectories
    exclude 'assets/lumenfx/shaders/fog/integrate.comp'
    exclude 'assets/lumenfx/shaders/compute/volume/preshaded.csh'
    exclude 'META-INF/licenses/**'
    if (usesBlaze3dGpu) {
        exclude 'assets/lumenfx/shaders/compute/**'
    } else {
        // Resource-pack materials import these shared GLSL includes on every backend.
        exclude { entry ->
            def path = entry.relativePath.pathString
            path.startsWith('assets/lumenfx/shaders/') &&
                    path != 'assets/lumenfx/shaders/include' &&
                    !path.startsWith('assets/lumenfx/shaders/include/')
        }
        exclude 'assets/photon/**'
    }
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}
tasks.named('processTestResources', ProcessResources) {
    def testResDir = new File(commonRoot, usesBlaze3dGpu ? 'src/test/resources' : 'src/test/opengl/resources')
    if (testResDir.isDirectory()) {
        from testResDir
    }
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}
tasks.named('sourcesJar', Jar) {
    dependsOn generateBuildInfo
    if (usesRenderPearl) {
        dependsOn prepareRenderPearlSources
        from renderPearlOutDir
        from native263Dirs
    } else {
        from javaSourceTrees
    }
    from constants
    from resourceDirectories
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}
tasks.named('test', Test) {
    useJUnitPlatform()
    workingDir = templeRoot
    def testJavaDir = new File(commonRoot, usesBlaze3dGpu ? 'src/test/java' : 'src/test/opengl/java')
    if (!testJavaDir.isDirectory()) {
        enabled = false
    }
}

def commonPath = path
def commonSourceSets = sourceSets
rootProject.afterEvaluate {
    def sdk = rootProject.configurations.compileClasspath.copyRecursive { dependency ->
        !(dependency instanceof ProjectDependency && dependency.path == commonPath)
    }
    def sdkRuntime = rootProject.configurations.runtimeClasspath.copyRecursive { dependency ->
        !(dependency instanceof ProjectDependency && dependency.path == commonPath)
    }
    commonSourceSets.main.compileClasspath += sdk
    commonSourceSets.test.compileClasspath += sdk
    commonSourceSets.test.runtimeClasspath = files(rootProject.sourceSets.main.output.resourcesDir) +
            commonSourceSets.test.runtimeClasspath + sdk + sdkRuntime
}
tasks.named('test', Test) {
    dependsOn rootProject.tasks.named('processResources')
}
ext.templeResourceDirectories = resourceDirectories
ext.templeSourceDirectories = javaDirectories + [constants]
ext.templeSourceTrees = usesRenderPearl ? [files(renderPearlOutDir) { builtBy prepareRenderPearlSources }] + native263Dirs + [constants] : javaSourceTrees + [constants]
apply from: new File(templeRoot, 'gradle/target-conventions/ide-sources.gradle')
