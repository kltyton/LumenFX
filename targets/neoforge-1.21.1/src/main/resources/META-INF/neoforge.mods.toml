modLoader="javafml"
loaderVersion="${fml_version_range}"
license="${mod_license}"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
authors="${mod_authors}"
description='''${mod_description}'''

[[mixins]]
config="lumenfx.keyframe.mixins.json"

[[dependencies.${mod_id}]]
modId="neoforge"
type="required"
versionRange="${loader_version_range}"
ordering="NONE"
side="BOTH"

[[dependencies.${mod_id}]]
modId="minecraft"
type="required"
versionRange="${minecraft_version_range}"
ordering="NONE"
side="BOTH"

[[dependencies.${mod_id}]]
modId="iris"
type="optional"
versionRange="[1.8.0,)"
ordering="NONE"
side="CLIENT"

[[dependencies.${mod_id}]]
modId="sodium"
type="optional"
versionRange="[0.6.0,)"
ordering="NONE"
side="CLIENT"
